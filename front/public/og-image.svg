<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Background Ambient Glow -->
  <circle cx="1050" cy="120" r="280" fill="#0d9488" opacity="0.18" filter="url(#glow)" />
  <circle cx="150" cy="520" r="320" fill="#14b8a6" opacity="0.12" filter="url(#glow)" />
  <circle cx="950" cy="480" r="220" fill="#f59e0b" opacity="0.10" filter="url(#glow)" />

  <!-- Subtle Grid lines -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.04">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Top Logo & Brand -->
  <g transform="translate(100, 85)">
    <!-- Icon Box -->
    <rect width="72" height="72" rx="20" fill="url(#primaryGrad)" />
    <!-- Fork & Knife Icon -->
    <g fill="#ffffff" transform="translate(12, 12) scale(0.093)">
      <path d="M196 128c-8.8 0-16 7.2-16 16v104c0 13.2-10.8 24-24 24s-24-10.8-24-24V144c0-8.8-7.2-16-16-16s-16 7.2-16 16v104c0 30.9 25.1 56 56 56v80c0 8.8 7.2 16 16 16s16-7.2 16-16v-80c30.9 0 56-25.1 56-56V144c0-8.8-7.2-16-16-16s-16 7.2-16 16v88c0 4.4-3.6 8-8 8s-8-3.6-8-8v-88c0-8.8-7.2-16-16-16z"/>
      <path d="M356 128c-37.6 0-68 42.9-68 96 0 41.8 20.5 76.9 48 87.9V384c0 8.8 7.2 16 16 16s16-7.2 16-16v-72.1c27.5-11 48-46.1 48-87.9 0-53.1-30.4-96-60-96z"/>
    </g>
    <!-- Brand Title -->
    <text x="94" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.5">RestoHub</text>
    <!-- SaaS Badge -->
    <rect x="290" y="20" width="130" height="34" rx="17" fill="#14b8a6" fill-opacity="0.18" stroke="#14b8a6" stroke-width="1.5" />
    <text x="355" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2dd4bf" text-anchor="middle">PLATEFORME SAAS</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="245" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
    La Solution Complète pour
  </text>
  <text x="100" y="315" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-1">
    Propulser Votre Restaurant en Ligne
  </text>

  <!-- Tagline / Subtitle -->
  <text x="100" y="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Menus QR Code interactifs • Commandes en temps réel • Suivi cuisine &amp; livraison
  </text>
  <text x="100" y="415" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Paiements Mobile Money intégrés • Suivi direct des livraisons &amp; cuisine
  </text>

  <!-- Feature Pills / Highlights -->
  <g transform="translate(100, 480)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="52" rx="26" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="26" r="10" fill="#10b981" />
      <text x="50" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#f8fafc">Menu QR Code</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(230, 0)">
      <rect width="250" height="52" rx="26" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="26" r="10" fill="#3b82f6" />
      <text x="50" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#f8fafc">Commandes Live</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(500, 0)">
      <rect width="250" height="52" rx="26" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="26" r="10" fill="#f59e0b" />
      <text x="50" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#f8fafc">Mobile Money (FedaPay)</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(770, 0)">
      <rect width="210" height="52" rx="26" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="26" r="10" fill="#ec4899" />
      <text x="50" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#f8fafc">Multi-Tenant</text>
    </g>
  </g>

  <!-- Bottom Brand URL / Watermark -->
  <text x="1100" y="585" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#64748b" text-anchor="end">restohub.app</text>
</svg>
